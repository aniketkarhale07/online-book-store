<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | BookNest</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

  <nav class="bg-indigo-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

      <a href="index.html" class="text-2xl font-bold">📚 BookNest</a>

      <div class="hidden md:flex gap-8">
        <a href="index.html" class="hover:text-yellow-300">Home</a>
        <a href="about.html" class="hover:text-yellow-300">About</a>
        <a href="books.html" class="hover:text-yellow-300">Books</a>
        <a href="cart.html" class="hover:text-yellow-300">Cart 🛒</a>
        <a href="contact.html" class="text-yellow-300 font-bold">Contact</a>
      </div>

    </div>
  </nav>

  <section class="max-w-4xl mx-auto px-6 py-16">

    <div class="bg-white rounded-3xl shadow-lg p-8">

      <h1 class="text-4xl font-bold text-indigo-900 text-center mb-3">
        Contact Us 📩
      </h1>

      <p class="text-center text-gray-500 mb-10">
        Have a question? We'd love to hear from you.
      </p>

      <form class="space-y-6">

        <div>
          <label class="block font-semibold mb-2">Name</label>
          <input type="text"
                 placeholder="Enter your name"
                 class="w-full border rounded-xl px-4 py-3
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block font-semibold mb-2">Email</label>
          <input type="email"
                 placeholder="Enter your email"
                 class="w-full border rounded-xl px-4 py-3
                        focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block font-semibold mb-2">Message</label>
          <textarea rows="5"
                    placeholder="Write your message..."
                    class="w-full border rounded-xl px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-indigo-700 text-white py-3 rounded-xl
                       font-bold hover:bg-indigo-800 transition">
          Send Message 🚀
        </button>

      </form>

    </div>

  </section>

  <footer class="bg-gray-900 text-white text-center py-6">
    © 2026 BookNest. All Rights Reserved.
  </footer>

</body>
</html>
